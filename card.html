<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in-site — Card Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Preview page background only — not part of the card */
    body {
      margin: 0;
      padding: 48px 20px;
      background: #eef2f7;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    /*
    =====================================================================
    EMBED INSTRUCTIONS
    Copy the <style> block below AND the <div class="da-tool-card"> block
    into your website's HTML / Custom-Code embed widget.
    =====================================================================
    */

    .da-tool-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 34px 30px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04),
                  0 10px 32px rgba(15, 23, 42, 0.08);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
    }

    /* Icon tile — light blue square with a clean blue line icon */
    .da-icon {
      width: 56px;
      height: 56px;
      background: #eff6ff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .da-icon svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    /* FREE TOOL badge */
    .da-badge {
      display: inline-block;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* Title */
    .da-title {
      font-size: 23px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin: 0 0 14px;
    }

    /* Description */
    .da-body {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
      margin: 0 0 26px;
    }

    /* CTA link — matches the site's "Access portal →" style */
    .da-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2563eb;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: gap 0.15s ease;
    }
    .da-link svg {
      width: 18px;
      height: 18px;
    }
    .da-link:hover {
      gap: 12px;
      color: #1d4ed8;
    }
  </style>
</head>
<body>

<!-- =================  COPY FROM HERE  ================= -->

<div class="da-tool-card">

  <div class="da-icon">
    <!-- camera line icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3.2"/>
    </svg>
  </div>

  <div class="da-badge">Free Tool</div>

  <h3 class="da-title">AI Property Inspector</h3>

  <p class="da-body">
    Snap or upload site photos and get instant AI findings on defects, safety risks, and maintenance issues — annotate the photos and export a print-ready inspection report. Also handles document analysis, Lean 5S audits, and meeting transcription.
  </p>

  <a class="da-link" href="https://dror75p-ops.github.io/Transcribe_meeting/" target="_blank" rel="noopener noreferrer">
    Open tool
    <!-- arrow icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </a>

</div>

<!-- =================  COPY UP TO HERE  ================= -->

</body>
</html>
