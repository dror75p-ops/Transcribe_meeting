name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-based publishing (gh-pages) so PR previews can live alongside
# production in subfolders. Requires repo Settings → Pages → Source =
# "Deploy from a branch" → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          # Never wipe active PR previews when redeploying production.
          clean-exclude: |
            pr-preview/
