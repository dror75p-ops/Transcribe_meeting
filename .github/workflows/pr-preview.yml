name: PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Deploys each PR to gh-pages/pr-preview/pr-<N>/ and comments the live URL.
# The preview is removed automatically when the PR is merged or closed.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Deploy / update / clean up preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
